services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-chatbot-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"
    
    volumes:
      - qdrant_data:/qdrant/storage
    
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: rag-chatbot-backend

    ports:
      - "8000:8000"

    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}

      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL}
      LOCAL_VECTOR_SIZE: ${LOCAL_VECTOR_SIZE}

      API_KEY: ""
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL}
      CLOUD_EMBEDDING_MODEL: ${CLOUD_EMBEDDING_MODEL}
      CLOUD_VECTOR_SIZE: ${CLOUD_VECTOR_SIZE}
    
    volumes:
      - ./data/sessions:/app/data/sessions

    depends_on:
      qdrant:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  
  frontend:
    build:
      context: .
      dockerfile: FE/Dockerfile

    container_name: rag-chatbot-frontend

    ports:
      - "8501:8501"

    environment:
      API_BASE_URL: "http://backend:8000"

    depends_on:
      - backend

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  qdrant_data: